<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="272" viewBox="0 0 1280 272" role="img" aria-label="Install in a terminal: clone the repo, pip install -r requirements.txt, run the tests, then python3 BUNKER.py to create your vault.">
<title>Install: clone, pip install -r requirements.txt, run the tests, python3 BUNKER.py</title>
<defs><style>@font-face{font-family:'BkMono';src:url(data:font/woff2;base64,) format('woff2');}
text{font-family:BkMono;font-size:17px;white-space:pre}
.ln{animation:in .2s both}@keyframes in{from{opacity:0}to{opacity:1}}
.type{clip-path:inset(0 100% 0 0);animation:type steps(40,end) both}@keyframes type{to{clip-path:inset(0 0 0 0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;clip-path:none!important}}
</style></defs>
<rect x="1" y="1" width="1278" height="270" rx="14" fill="#FFFFFF" stroke="#D8DDE6"/>
<line x1="1" y1="44" x2="1279" y2="44" stroke="#D8DDE6"/>
<circle cx="26" cy="23" r="5" fill="#D8DDE6"/><circle cx="44" cy="23" r="5" fill="#D8DDE6"/><circle cx="62" cy="23" r="5" fill="#D8DDE6"/>
<text x="640" y="28" text-anchor="middle" fill="#8A93A3" style="font-size:13px">bunker — install</text>
<g class="ln" style="animation-delay:0.30s"><text x="40" y="92" fill="#B57A12">$</text><text x="60.42" y="92" fill="#0B0F17" class="type" style="--w:64ch;animation-delay:0.30s;animation-duration:1.40s">git clone https://github.com/ZeroMarks/BUNKER2.0 &amp;&amp; cd BUNKER2.0</text></g><g class="ln" style="animation-delay:2.05s"><text x="40" y="122" fill="#B57A12">$</text><text x="60.42" y="122" fill="#0B0F17" class="type" style="--w:83ch;animation-delay:2.05s;animation-duration:1.40s">pip install inputimeout keyboard cryptography pyperclip psutil requests argon2-cffi</text></g><g class="ln" style="animation-delay:3.80s"><text x="40" y="164" fill="#B57A12">$</text><text x="60.42" y="164" fill="#0B0F17" class="type" style="--w:17ch;animation-delay:3.80s;animation-duration:0.56s">python3 BUNKER.py</text></g><text class="ln" style="animation-delay:4.71s" x="40" y="194" fill="#8A93A3"># the included demo vault opens with the password: rootroot</text><text class="ln" style="animation-delay:5.01s" x="40" y="224" fill="#8A93A3"># delete Bunker.mmf first to create your own vault</text>
</svg>